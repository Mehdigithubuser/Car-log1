name: Build CarLog APK
# Manual rebuild trigger: keep workflow active on every push.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -e
          base64 -d signing/carlog-release.jks.b64 > signing/carlog-release.jks
          chmod 600 signing/carlog-release.jks
      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signature
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | tail -n 1)/apksigner verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLog-release-signed
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk             --repo "${{ github.repository }}"             --title "CarLog $TAG"             --generate-notes